[project]
name = "qwen3-tts-translator"
version = "0.1.0"
description = "Finnish to Portuguese speech translation using Qwen3-TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=4.57.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "pynput>=1.8.0",
    "numpy>=2.3.0",
    "huggingface-hub>=0.36.0",
    "sentencepiece>=0.2.0",
    "librosa>=0.11.0",
    "numba>=0.63.0",
    "scipy>=1.14.0",
    "qwen-tts>=0.0.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
qwen-translate = "qwen3_tts_translator.cli:main"
qwen-interactive = "qwen3_tts_translator.interactive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
