# https://learn.microsoft.com/en-us/training/modules/github-copilot-code-agent/4-customize-extend-validate-copilot-code-agent

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/chainguard-actions/actions-rust-lang-setup-rust-toolchain
      - name: Set up Rust
        uses: chainguard-actions/actions-rust-lang-setup-rust-toolchain@16b7ac9647c85f1db0d7e9dda7a9903702f4b3d2 # v2.0.1
        with:
          components: clippy, rustfmt
      
      # https://github.com/chainguard-actions/astral-sh-setup-uv
      - name: Set up uv
        uses: chainguard-actions/astral-sh-setup-uv@d074662c6bd48040f94d5f5eeae1479d285f0177 # v10.3.3