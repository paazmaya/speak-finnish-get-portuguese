[package]
name = "speech-fin-to-por"
version = "0.1.0"
edition = "2021"
description = "Finnish to Portuguese speech translation pipeline using Candle ML"
license = "MIT"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
homepage = "https://github.com/paazmaya/speak-finnish-get-portuguese"
repository = "https://github.com/paazmaya/speak-finnish-get-portuguese"
keywords = ["speech", "translation", "whisper", "tts", "candle"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false

[dependencies]
# Candle framework
candle-core = "0.9.2-alpha.2"
candle-nn = "0.9.2-alpha.2"
candle-transformers = "0.9.2-alpha.2"

# HuggingFace Hub integration
hf-hub = "0.4"
tokenizers = "0.21"

# Audio processing
hound = "3.5"  # WAV encoding/decoding
# https://github.com/RustAudio/cpal
cpal = { version = "0.15", default-features = false, features = ["jack"] }  # Cross-platform audio I/O for microphone capture

# Error handling and CLI
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Keyboard input for segmented recording
crossterm = "0.27"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
byteorder = "1.5"
safetensors = "0.4"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]

[patch.crates-io]
coreaudio-sys = { git = "https://github.com/RustAudio/coreaudio-sys", branch = "master" }
