[project]
name = "seamless-translator"
version = "0.1.0"
description = "Finnish to Portuguese speech translation using SeamlessM4T v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.20.0",
    "bitsandbytes>=0.41.0",
    "sentencepiece>=0.1.99",
    "tiktoken>=0.5.0",
    "protobuf>=3.20.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pynput>=1.7.6",
    "numpy>=1.24.0",
    "ruff>=0.14.14",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
seamless-translate = "seamless_translator.cli:main"
seamless-interactive = "seamless_translator.interactive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
